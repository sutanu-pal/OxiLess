{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculate your carbon footprint and compete with friends.">
    <title>Carbon Footprint Calculator</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: #1a1b1e;
            min-height: 100vh;
            color: #e1e3e6;
            line-height: 1.6;
        }

        header {
            background: #242730;
            border-bottom: 1px solid #3a3d42;
            padding: 2rem;
        }

        header h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 1.5rem;
            text-align: center;
            letter-spacing: -0.02em;
        }

        .header-content {
            text-align: center;
        }

        .nav-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .welcome-text {
            color: #9ca3af;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .username {
            color: #e1e3e6;
            font-weight: 600;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .nav-separator {
            color: #6b7280;
            font-weight: 300;
            font-size: 0.8rem;
        }

        .nav-link {
            color: #d1d5db;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            background: #374151;
            border: 1px solid #4b5563;
            transition: all 0.2s ease;
        }

        .nav-link:hover {
            background: #4b5563;
            color: #ffffff;
            border-color: #6b7280;
        }

        .nav-link:active {
            background: #374151;
        }

        /* Guest navigation styling */
        .guest-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            header {
                padding: 1.5rem 1rem;
            }
            
            header h1 {
                font-size: 1.5rem;
                margin-bottom: 1rem;
            }
            
            .nav-container {
                flex-direction: column;
                gap: 0.75rem;
            }
            
            .nav-links {
                flex-direction: column;
                gap: 0.5rem;
                width: 100%;
                align-items: stretch;
            }
            
            .nav-separator {
                display: none;
            }
            
            .nav-link {
                text-align: center;
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }

            .guest-nav {
                flex-direction: column;
                width: 100%;
            }

            .guest-nav .nav-link {
                width: 100%;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 1rem 0.75rem;
            }
            
            header h1 {
                font-size: 1.35rem;
            }
            
            .nav-link {
                padding: 0.5rem 0.75rem;
                font-size: 0.85rem;
            }

            .welcome-text {
                font-size: 0.85rem;
                text-align: center;
                margin-bottom: 0.5rem;
            }
        }

        /* Additional mobile optimizations */
        @media (max-width: 640px) {
            .nav-container {
                align-items: stretch;
            }

            .welcome-text {
                width: 100%;
                text-align: center;
                padding-bottom: 0.5rem;
                border-bottom: 1px solid #3a3d42;
                margin-bottom: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Carbon Footprint Calculator</h1>
        <div class="header-content">
            {% if user.is_authenticated %}
                <div class="nav-container">
                    <div class="welcome-text">
                        Welcome, <span class="username">{{ user }}</span>
                    </div>
                    <div class="nav-links">
                        <a href="{% url 'leaderboard' %}" class="nav-link">Leaderboard</a>
                        <span class="nav-separator">|</span>
                        <a href="{% url 'group_create' %}" class="nav-link">Create Group</a>
                        <span class="nav-separator">|</span>
                        <a href="{% url 'group_join' %}" class="nav-link">Join Group</a>
                        <span class="nav-separator">|</span>
                        <a href="{% url 'account_logout' %}" class="nav-link">Logout</a>
                    </div>
                </div>
            {% else %}
                <div class="guest-nav">
                    <a href="{% url 'account_login' %}" class="nav-link">Login</a>
                    <span class="nav-separator">|</span>
                    <a href="{% url 'account_signup' %}" class="nav-link">Sign Up</a>
                </div>
            {% endif %}
        </div>
    </header>
    {% block content %}
    {% endblock %}
</body>
</html>
