{% extends 'base.html' %}
{% block content %}
<style>
    .dark-container {
        max-width: 450px;
        margin: 0 auto;
        padding: 2rem;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #0a0a0a;
        min-height: 100vh;
        color: #e5e5e5;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
    }

    .dark-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: 
            radial-gradient(circle at 25% 25%, rgba(34, 197, 94, 0.08) 1px, transparent 1px),
            radial-gradient(circle at 75% 75%, rgba(34, 197, 94, 0.05) 1px, transparent 1px);
        background-size: 50px 50px;
        animation: patternMove 20s linear infinite;
        z-index: 0;
    }

    @keyframes patternMove {
        0% { transform: translate(0, 0); }
        100% { transform: translate(50px, 50px); }
    }

    .login-card {
        background: rgba(20, 20, 20, 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 2.5rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        animation: fadeIn 0.6s ease-out;
        position: relative;
        z-index: 1;
        width: 100%;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    h2 {
        color: #ffffff;
        font-size: 2rem;
        font-weight: 600;
        text-align: center;
        margin-bottom: 2rem;
        position: relative;
    }

    h2::after {
        content: '';
        position: absolute;
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 2px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 1px;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        margin-bottom: 1.5rem;
    }

    form p {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin: 0;
    }

    form label {
        font-weight: 500;
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.9rem;
        transition: color 0.2s ease;
    }

    form input,
    form select,
    form textarea {
        padding: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.2s ease;
        background: rgba(255, 255, 255, 0.05);
        color: #ffffff;
        backdrop-filter: blur(5px);
    }

    form input::placeholder,
    form select::placeholder,
    form textarea::placeholder {
        color: rgba(255, 255, 255, 0.4);
    }

    form input:focus,
    form select:focus,
    form textarea:focus {
        outline: none;
        border-color: rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
    }

    form input:hover,
    form select:hover,
    form textarea:hover {
        border-color: rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.07);
    }

    button[type="submit"] {
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 1rem 2rem;
        font-size: 1rem;
        font-weight: 500;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-top: 0.5rem;
        position: relative;
        overflow: hidden;
    }

    button[type="submit"]:before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        transition: left 0.5s;
    }

    button[type="submit"]:hover:before {
        left: 100%;
    }

    button[type="submit"]:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.3);
        transform: translateY(-1px);
    }

    button[type="submit"]:active {
        transform: translateY(0);
    }

    p {
        text-align: center;
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.9rem;
        margin: 1rem 0;
    }

    a {
        color: rgba(255, 255, 255, 0.9);
        text-decoration: none;
        font-weight: 500;
        transition: all 0.2s ease;
        position: relative;
    }

    a:hover {
        color: #ffffff;
    }

    a::after {
        content: '';
        position: absolute;
        width: 0;
        height: 1px;
        bottom: -2px;
        left: 0;
        background: rgba(255, 255, 255, 0.7);
        transition: width 0.2s ease;
    }

    a:hover::after {
        width: 100%;
    }

    /* Google login styling */
    p:last-child a {
        background: rgba(255, 255, 255, 0.05);
        padding: 0.7rem 1.2rem;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: inline-block;
        transition: all 0.2s ease;
        font-size: 0.9rem;
    }

    p:last-child a:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
        transform: translateY(-1px);
    }

    p:last-child a::after {
        display: none;
    }

    /* Form group hover effects */
    form p:hover label {
        color: rgba(255, 255, 255, 0.9);
    }

    /* Subtle pulse animation for card */
    .login-card {
        animation: fadeIn 0.6s ease-out, pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
        0%, 100% { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
        50% { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05); }
    }

    /* Responsive design */
    @media (max-width: 768px) {
        .dark-container {
            padding: 1rem;
        }
        
        .login-card {
            padding: 2rem 1.5rem;
        }
        
        h2 {
            font-size: 1.8rem;
        }
    }

    /* Subtle grid animation overlay */
    .login-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: 
            linear-gradient(rgba(34, 197, 94, 0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(34, 197, 94, 0.04) 1px, transparent 1px);
        background-size: 20px 20px;
        border-radius: 16px;
        opacity: 0;
        animation: gridFade 6s ease-in-out infinite;
        pointer-events: none;
    }

    @keyframes gridFade {
        0%, 100% { opacity: 0; }
        50% { opacity: 1; }
    }
</style>

<div class="dark-container">
    <div class="login-card">
        <h2>Login</h2>
        <form method="post" action="{% url 'account_login' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
        <p><a href="{% url 'account_signup' %}">Sign Up</a> | <a href="{% url 'account_reset_password' %}">Forgot Password?</a></p>
        <p><a href="{% provider_login_url 'google' %}">Login with Google</a></p>
    </div>
</div>
{% endblock %}
